<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Products</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f3f4f6;
          padding: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        h1 {
          margin-bottom: 10px;
          text-align: center;
        }
        nav {
          width: 100%;
          background: #BC8F8F;
          padding: 10px;
          display: flex;
          justify-content: center;
          gap: 20px;
          margin-bottom: 20px;
        }
        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: bold;
          padding: 6px 12px;
          border-radius: 4px;
        }
        nav a:hover {
          background: #A52A2A;
        }
        form {
          background: white;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          max-width: 400px;
          width: 100%;
        }
        label {
          display: block;
          margin-top: 10px;
          font-weight: bold;
        }
        input {
          width: 100%;
          padding: 8px;
          margin-top: 6px;
          border: 1px solid #ccc;
          border-radius: 6px;
        }
        button {
          margin-top: 15px;
          padding: 10px 16px;
          background: #BC8F8F;
          color: #A52A2A;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }
        button:hover {
          background: #1e40af;
          color: white;
        }
        #response {
          margin-top: 20px;
          padding: 10px;
          background: #fef2f2;
          border-radius: 6px;
          display: none;
        }
    </style>
</head>
<body>
<!-- Menu -->
<nav>
    <a href="createProduct.html">➕ Add Product</a>
    <a href="updateProduct.html">✏️ Update Product</a>
    <a href="getProductById.html">🔍 Get Product By ID</a>
    <a href="deleteProduct.html">🗑️ Delete Product</a>
    <a href="getAllProducts.html">📋 View All Products</a>
</nav>

<h1>Update a Product</h1>

<form id="updateForm">
    <label for="id">Product ID:</label>
    <input type="number" id="id" name="id" required placeholder="Enter Id" />

    <label for="name">New Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter new product name"/>

    <label for="category">New Category:</label>
    <input type="text" id="category" name="category" placeholder="Enter new category"/>

    <label for="price">New Price:</label>
    <input type="number" id="price" name="price" step="0.01" placeholder="Enter price"/>

    <label for="availableQuantity">New Quantity:</label>
    <input type="number" id="availableQuantity" name="availableQuantity" placeholder="Enter Available Quantity"/>

    <button type="submit">Update Product</button>
</form>

<div id="response"></div>

<script>
    const form = document.getElementById("updateForm");
    const responseBox = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const product = {
        id: parseInt(document.getElementById("id").value),
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: parseFloat(document.getElementById("price").value),
        availableQuantity: parseInt(document.getElementById("availableQuantity").value)
      };

      try {
        const res = await fetch("http://localhost:8080/updateProduct", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(product)
        });

        if (!res.ok) {
          const text = await res.text();
          responseBox.textContent = "Error updating product: " + text;
        } else {
          const updated = await res.json();
          responseBox.textContent = "✅ Product updated successfully! New name: " + updated.name;
        }
        responseBox.style.display = "block";
      } catch (err) {
        responseBox.textContent = "Error: " + err;
        responseBox.style.display = "block";
      }
    });
</script>
</body>
</html>
