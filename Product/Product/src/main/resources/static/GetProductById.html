<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f3f4f6;
          margin: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 100vh;
        }

        nav {
          width: 100%;
          background: #BC8F8F;
          padding: 10px;
          display: flex;
          justify-content: center;
          gap: 20px;
        }

        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: bold;
          padding: 6px 12px;
          border-radius: 4px;
        }

        nav a:hover {
          background: #A52A2A;
        }

        main {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          width: 100%;
        }

        h1 {
          margin: 20px 0 10px;
          text-align: center;
        }

        label {
          font-weight: bold;
          margin-top: 10px;
        }

        input {
          padding: 8px;
          margin-top: 10px;
          border-radius: 6px;
          border: 1px solid #ccc;
          width: 200px;
        }

        button {
          padding: 8px 12px;
          margin-top: 10px;
          border-radius: 6px;
          border: 1px solid #ccc;
          background: #BC8F8F;
          color: #A52A2A;
          cursor: pointer;
        }

        button:hover {
          background: #1e40af;
          color: white;
        }

        .card {
          background: white;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          max-width: 500px;
          width: 100%;
          margin-top: 20px;
        }

        .field {
          margin-bottom: 12px;
        }

        .label {
          font-weight: bold;
          color: #374151;
        }

        .value {
          color: #111827;
        }

        .status {
          display: inline-block;
          padding: 4px 10px;
          border-radius: 12px;
          font-size: 13px;
          color: white;
          background: #22c55e;
        }

        .status.inactive {
          background: #ef4444;
        }

        .error {
          background: #fee2e2;
          color: #b91c1c;
          padding: 15px;
          border-radius: 8px;
          margin-top: 20px;
          width: 100%;
          max-width: 500px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<!-- ✅ Menu pinned to top -->
<nav>
    <a href="createProduct.html">➕ Add Product</a>
    <a href="updateProduct.html">✏️ Update Product</a>
    <a href="getProductById.html">🔍 Get Product By ID</a>
    <a href="deleteProduct.html">🗑️ Delete Product</a>
    <a href="getAllProducts.html">📋 View All Products</a>
</nav>

<main>
    <h1>Product Details</h1>

    <label for="productInput">Enter Product ID:</label>
    <input type="number" id="productInput" placeholder="e.g. 1" />
    <button onclick="loadProduct()">🔍 Load Product</button>

    <!-- Product card -->
    <div class="card" id="productCard" style="display:none;">
        <div class="field"><span class="label">ID:</span> <span class="value" id="productId">—</span></div>
        <div class="field"><span class="label">Name:</span> <span class="value" id="productName">—</span></div>
        <div class="field"><span class="label">Category:</span> <span class="value" id="productCategory">—</span></div>
        <div class="field"><span class="label">Price:</span> <span class="value" id="productPrice">—</span></div>
        <div class="field"><span class="label">Available Quantity:</span> <span class="value" id="productQuantity">—</span></div>
        <div class="field"><span class="label">Created:</span> <span class="value" id="createdDate">—</span></div>
        <div class="field"><span class="label">Updated:</span> <span class="value" id="updatedDate">—</span></div>
        <div class="field"><span class="label">Status:</span> <span class="status" id="status">—</span></div>
    </div>

    <!-- Error card -->
    <div class="error" id="errorCard" style="display:none;">
        <div><strong>Timestamp:</strong> <span id="errorTimestamp">—</span></div>
        <div><strong>Status:</strong> <span id="errorStatus">—</span></div>
        <div><strong>Error:</strong> <span id="errorMessage">—</span></div>
        <div><strong>Path:</strong> <span id="errorPath">—</span></div>
    </div>
</main>
<script>
    async function loadProduct() {
      const id = document.getElementById("productInput").value;
      if (!id) {
        alert("Please enter a product ID.");
        return;
      }

      try {
        const res = await fetch(`http://localhost:8080/getProductById/${id}`);

        if (!res.ok) {
          // Try to parse JSON, fallback to text
          let errorData;
          const contentType = res.headers.get("content-type");
          if (contentType && contentType.includes("application/json")) {
            errorData = await res.json();
          } else {
            const text = await res.text();
            errorData = {
              timestamp: new Date().toLocaleString(),
              status: res.status,
              error: text,
              path: `getProductById/${id}`
            };
          }
          showError(errorData);
          return;
        }

        const data = await res.json();
        showProduct(data);
      } catch (err) {
        showError({
          timestamp: new Date().toLocaleString(),
          status: "Network Error",
          error: err.message,
          path: `getProductById/${id}`
        });
      }
    }

    function showProduct(data) {
      document.getElementById("productCard").style.display = "block";
      document.getElementById("errorCard").style.display = "none";

      document.getElementById("productId").textContent = data.id ?? "—";
      document.getElementById("productName").textContent = data.name ?? "—";
      document.getElementById("productCategory").textContent = data.category ?? "—";
      document.getElementById("productPrice").textContent = data.price ?? "—";
      document.getElementById("productQuantity").textContent = data.availableQuantity ?? "—";
      document.getElementById("createdDate").textContent = formatDate(data.createdDate);
      document.getElementById("updatedDate").textContent = formatDate(data.updatedDate);

      const statusEl = document.getElementById("status");
      if (data.isActive === null || data.isActive === undefined) {
        statusEl.textContent = "—";
        statusEl.className = "status inactive";
      } else {
        statusEl.textContent = data.isActive ? "Active" : "Inactive";
        statusEl.className = "status" + (data.isActive ? "" : " inactive");
      }
    }

    function showError(errorData) {
      document.getElementById("errorCard").style.display = "block";
      document.getElementById("productCard").style.display = "none";

      document.getElementById("errorTimestamp").textContent = errorData.timestamp ?? "—";
      document.getElementById("errorStatus").textContent = errorData.status ?? "—";
      document.getElementById("errorMessage").textContent = errorData.error ?? "—";
      document.getElementById("errorPath").textContent = errorData.path ?? "—";
    }

    function formatDate(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      return isNaN(d) ? "—" : d.toLocaleString();
    }
</script>
</body>
</html>
