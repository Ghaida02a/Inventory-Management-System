<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f3f4f6;
          padding: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        h1 {
          margin-bottom: 10px;
          text-align: center;
        }
        nav {
          width: 100%;
          background: #BC8F8F;
          padding: 10px;
          display: flex;
          justify-content: center;
          gap: 20px;
          margin-bottom: 20px;
        }
        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: bold;
          padding: 6px 12px;
          border-radius: 4px;
        }
        nav a:hover {
          background: #A52A2A;
        }
        form {
          background: white;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          max-width: 400px;
          width: 100%;
        }
        label {
          display: block;
          margin-top: 10px;
          font-weight: bold;
        }
        input {
          width: 100%;
          padding: 8px;
          margin-top: 6px;
          border: 1px solid #ccc;
          border-radius: 6px;
        }
        button {
          margin-top: 15px;
          padding: 10px 16px;
          background: #BC8F8F;
          color: #A52A2A;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }
        button:hover {
          background: #1e40af;
          color: white;
        }
        #response {
          margin-top: 20px;
          padding: 10px;
          background: #fef2f2;
          border-radius: 6px;
          display: none;
        }
    </style>
</head>
<body>
<nav>
    <a href="index.html"> Home</a>
    <a href="CreateProduct.html">➕ Add Product</a>
    <a href="UpdateProduct.html">✏️ Update Product</a>
    <a href="GetProductById.html">🔍 Get Product By ID</a>
    <a href="DeleteProduct.html">🗑️ Delete Product</a>
    <a href="GetAllProducts.html">📋 View All Products</a>
</nav>

<h1>Product List</h1>
<table id="productTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Available Quantity</th>
        <th>Created Date</th>
        <th>Updated Date</th>
        <th>Active</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
    const tbody = document.querySelector("#productTable tbody");

    async function loadProducts() {
      try {
        const res = await fetch("http://localhost:8080/product");
        const products = await res.json();

        tbody.innerHTML = ""; // clear old rows

        products.forEach(product => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${product.id ?? "—"}</td>
            <td>${product.name ?? "—"}</td>
            <td>${product.category ?? "—"}</td>
            <td>${product.price ?? "—"}</td>
            <td>${product.availableQuantity ?? "—"}</td>
            <td>${product.createdDate ?? "—"}</td>
            <td>${product.updatedDate ?? "—"}</td>
            <td>${product.isActive ? "Yes" : "No"}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    loadProducts();
</script>
</body>
</html>
