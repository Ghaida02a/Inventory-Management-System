<h1>Create a Product</h1>
<form id="productForm">
    <label for="name">Product Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter product name"/>

    <label for="category">Category:</label>
    <input type="text" id="category" name="category" placeholder="Enter category"/>

    <label for="price">Price:</label>
    <input type="number" id="price" name="price" step="0.01" placeholder="Enter Price"/>

    <label for="availableQuantity">Available Quantity:</label>
    <input type="number" id="availableQuantity" name="availableQuantity" placeholder="Enter Available quantity"/>

    <button type="submit">Add Product</button>
    <button type="button" onclick="refreshForm()">🔄 Refresh</button>
</form>

<div id="response"></div>

<script>
    const form = document.getElementById("productForm");
    const responseBox = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const product = {
        name: document.getElementById("name").value,
        category: document.getElementById("category").value,
        price: parseFloat(document.getElementById("price").value),
        availableQuantity: parseInt(document.getElementById("availableQuantity").value)
      };

      try {
        const res = await fetch("http://localhost:8080/product", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(product)
        });

        if (!res.ok) {
          throw new Error(`Server responded with status ${res.status}`);
        }

        const data = await res.json();
        responseBox.innerHTML = `
          <strong>✅ Product Created Successfully:</strong>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
        responseBox.style.display = "block";
        responseBox.style.background = "#e6ffed";
      } catch (err) {
        responseBox.innerHTML = `
          <strong>❌ Error creating product:</strong>
          <pre>${err.message}</pre>
        `;
        responseBox.style.display = "block";
        responseBox.style.background = "#fef2f2";
      }
    });

    function refreshForm() {
      form.reset();
      responseBox.style.display = "none";
    }
</script>
