<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f3f4f6;
          margin: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          min-height: 100vh;
        }

        nav {
          width: 100%;
          background: #BC8F8F;
          padding: 10px;
          display: flex;
          justify-content: center;
          gap: 20px;
        }

        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: bold;
          padding: 6px 12px;
          border-radius: 4px;
        }

        nav a:hover {
          background: #A52A2A;
        }

        main {
          flex: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          width: 100%;
        }

        h1 {
          margin: 20px 0 10px;
          text-align: center;
        }

        label {
          font-weight: bold;
          margin-top: 10px;
        }

        input {
          padding: 8px;
          margin-top: 10px;
          border-radius: 6px;
          border: 1px solid #ccc;
          width: 200px;
        }

        button {
          padding: 8px 12px;
          margin-top: 10px;
          border-radius: 6px;
          border: 1px solid #ccc;
          background: #BC8F8F;
          color: #A52A2A;
          cursor: pointer;
        }

        button:hover {
          background: #1e40af;
          color: white;
        }

        #response {
          margin-top: 20px;
          font-size: 16px;
          color: black;
          background: #FEF2F2;
          padding: 10px;
          border-radius: 6px;
          display: none;
          max-width: 400px;
          text-align: center;
        }
    </style>
</head>
<body>
<!-- ✅ Menu -->
<nav>
    <a href="createProduct.html">➕ Add Product</a>
    <a href="updateProduct.html">✏️ Update Product</a>
    <a href="getProductById.html">🔍 Get Product By ID</a>
    <a href="deleteProduct.html">🗑️ Delete Product</a>
    <a href="getAllProducts.html">📋 View All Products</a>
</nav>

<main>
    <h1>Delete Product</h1>

    <label for="productId">Enter Product ID:</label>
    <input type="number" id="productId" placeholder="e.g. 1" />
    <button onclick="deleteProduct()">🗑️ Delete</button>

    <div id="response"></div>
</main>

<script>
    async function deleteProduct() {
      const id = document.getElementById("productId").value;
      if (!id) {
        alert("Please enter a product ID.");
        return;
      }

      try {
        const res = await fetch(`http://localhost:8080/deleteProduct/${id}`, {
          method: "DELETE"
        });

        const text = await res.text();
        const responseBox = document.getElementById("response");
        responseBox.textContent = text;
        responseBox.style.display = "block";
      } catch (err) {
        const responseBox = document.getElementById("response");
        responseBox.textContent = "Error deleting product: " + err;
        responseBox.style.display = "block";
      }
    }
</script>
</body>
</html>
