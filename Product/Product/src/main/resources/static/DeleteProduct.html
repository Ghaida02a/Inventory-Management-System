<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
          font-family: Arial, sans-serif;
          background: #f3f4f6;
          padding: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        h1 {
          margin-bottom: 10px;
          text-align: center;
        }
        nav {
          width: 100%;
          background: #BC8F8F;
          padding: 10px;
          display: flex;
          justify-content: center;
          gap: 20px;
          margin-bottom: 20px;
        }

        nav a {
          color: #fff;
          text-decoration: none;
          font-weight: bold;
          padding: 6px 12px;
          border-radius: 4px;
        }

        nav a:hover {
          background: #A52A2A;
        }
        form {
          background: white;
          padding: 20px;
          border-radius: 8px;
          box-shadow: 0 2px 6px rgba(0,0,0,0.1);
          max-width: 400px;
          width: 100%;
        }
        label {
          display: block;
          margin-top: 10px;
          font-weight: bold;
        }

        input {
          width: 100%;
          padding: 8px;
          margin-top: 6px;
          border: 1px solid #ccc;
          border-radius: 6px;
        }

        button {
          margin-top: 15px;
          padding: 10px 16px;
          background: #BC8F8F;
          color: #A52A2A;
          border: none;
          border-radius: 6px;
          cursor: pointer;
        }

        button:hover {
          background: #1e40af;
          color: white;
        }

        #response {
          margin-top: 20px;
          padding: 10px;
          background: #fef2f2;
          border-radius: 6px;
          display: none;
        }
    </style>
</head>
<body>
<nav>
    <a href="index.html"> Home</a>
    <a href="CreateProduct.html">➕ Add Product</a>
    <a href="UpdateProduct.html">✏️ Update Product</a>
    <a href="GetProductById.html">🔍 Get Product By ID</a>
    <a href="DeleteProduct.html">🗑️ Delete Product</a>
    <a href="GetAllProducts.html">📋 View All Products</a>
</nav>

<main>
    <h1>Delete Product</h1>

    <label for="productId">Enter Product ID:</label>
    <input type="number" id="productId" placeholder="e.g. 1" />
    <button onclick="deleteProduct()">🗑️ Delete</button>

    <div id="response"></div>
</main>

<script>
    async function deleteProduct() {
      const id = document.getElementById("productId").value;
      if (!id) {
        alert("Please enter a product ID.");
        return;
      }

      try {
        const res = await fetch(`http://localhost:8080/product/${id}`, {
          method: "DELETE"
        });

        const text = await res.text();
        const responseBox = document.getElementById("response");
        responseBox.textContent = text;
        responseBox.style.display = "block";
      } catch (err) {
        const responseBox = document.getElementById("response");
        responseBox.textContent = "Error deleting product: " + err;
        responseBox.style.display = "block";
      }
    }
</script>
</body>
</html>
